packages:
  - apps/*
  - packages/*
  # PHP plugin — built and tested with its own tooling (Composer, PHPUnit, PHPCS).
  - "!apps/wp-plugin"

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true

# Pinned transitive versions (each at least two weeks old when pinned).
overrides:
  # A direct dependency of core since S8-F7 (was through heic-decode 2.1.0); 1.23.2 (2026-09-05) was the newest
  # release older than two weeks (S3-04).
  libheif-js: 1.23.2
