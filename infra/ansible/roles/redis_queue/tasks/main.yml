# BullMQ's Redis on db-1 (PLAN §5.5 Stage A): AOF every second, never evicts. Same settings as the
# local `redis-queue` service. Reached by workers over WireGuard with a password.
- name: Data directory
  ansible.builtin.file:
    path: /srv/redis-queue
    state: directory
    owner: "999"
    group: "1000"
    mode: "0750"

# The passwords go raw into a config line and into REDIS_*_URL: URL-safe characters only.
- name: redis-queue passwords are set and URL-safe
  ansible.builtin.assert:
    that:
      - vault_redis_limits_password is defined
      - vault_redis_limits_password is match('^[A-Za-z0-9_-]{32,}$')
      - vault_redis_media_password is defined
      - vault_redis_media_password is match('^[A-Za-z0-9_-]{32,}$')
      - vault_redis_exporter_password is defined
      - vault_redis_exporter_password is match('^[A-Za-z0-9_-]{32,}$')
      - redis_queue_maxmemory is defined
      - vault_redis_feed_ai_password is not defined or vault_redis_feed_ai_password is match('^[A-Za-z0-9_-]{32,}$')
    fail_msg: vault_redis_limits_password, vault_redis_media_password and vault_redis_exporter_password must be 32+ URL-safe characters (openssl rand -hex 32); redis_queue_maxmemory must be set per environment
  no_log: true

# Password in a 0600 file, not argv (visible in `ps` to every local user).
- name: redis-queue config
  ansible.builtin.copy:
    dest: /etc/inmolink/redis-queue.conf
    content: |
      bind 127.0.0.1 {{ wg_ip }}
      port {{ redis_queue_port }}
      protected-mode yes
      requirepass {{ vault_redis_queue_password }}
      # Request apps keep rate-limit counters here because it never evicts (S1-F6). Their user reaches
      # only `inl:rl:*` keys and the commands the limiter needs: no queue key, no admin command.
      user limits on >{{ vault_redis_limits_password }} {{ redis_limits_acl }}
      # The media container (S3-F7) decodes untrusted uploads: its own queue keys only, never another pool's.
      user media on >{{ vault_redis_media_password }} {{ redis_media_acl }}
      # redis_exporter (S7-F7): server state only, no key.
      user exporter on >{{ vault_redis_exporter_password }} {{ redis_exporter_acl }}
      # feed-api's AI search (S12-08, ADR 0018 — Proposed): produces `ai` pool jobs (usage records, spend refreshes)
      # only. Created once the vault holds its password (openssl rand -hex 32). One inline expression: a Jinja if-tag
      # line at column 0 ends the YAML block scalar (CI fix).
      {{ ('user feed_ai on >' ~ vault_redis_feed_ai_password ~ ' ' ~ redis_feed_ai_acl) if vault_redis_feed_ai_password is defined else '# feed_ai: no vault password yet' }}
      appendonly yes
      appendfsync everysec
      # A ceiling the memory alerts measure against (RedisMemoryHigh 80 %, RedisMemoryCritical 95 %; S7-F7): without
      # one, redis_memory_max_bytes is 0 and they never fire. noeviction: at the ceiling writes fail.
      maxmemory {{ redis_queue_maxmemory }}
      maxmemory-policy noeviction
      dir /data
    owner: "999"
    group: "1000"
    mode: "0600"
  register: redis_queue_config
  no_log: true

- name: redis-queue
  community.docker.docker_container:
    name: redis-queue
    image: "{{ redis_image }}"
    network_mode: host
    restart_policy: unless-stopped
    volumes:
      - /srv/redis-queue:/data
      - /etc/inmolink/redis-queue.conf:/usr/local/etc/redis/redis.conf:ro
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: "{{ redis_queue_config.changed }}"

# Memory and server metrics for Prometheus (S7-F7: RedisMemoryHigh / RedisMemoryCritical, infra/monitoring/rules/
# redis.yml), on the WireGuard address only; logs in as the keyless `exporter` ACL user.
- name: redis-queue exporter
  community.docker.docker_container:
    name: redis-queue-exporter
    image: "{{ redis_exporter_image }}"
    network_mode: host
    restart_policy: unless-stopped
    env:
      REDIS_ADDR: "redis://127.0.0.1:{{ redis_queue_port }}"
      REDIS_USER: exporter
      REDIS_PASSWORD: "{{ vault_redis_exporter_password }}"
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: "{{ wg_ip }}:{{ redis_exporter_port }}"
      # No CONFIG in its ACL: take `maxmemory` from INFO only.
      REDIS_EXPORTER_CONFIG_COMMAND: "-"
      # `/scrape?target=` would log in to any target with this exporter's password.
      REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT: "true"
  no_log: true

# The exporter listens on the WireGuard address, which every private host reaches (roles/wireguard): only the
# monitoring host(s) may scrape it. Inserted above the private-network allow (ufw: first match wins); the deny first,
# then the allows above it.
- name: Firewall — redis-queue exporter closed to the private network
  community.general.ufw:
    rule: deny
    interface: wg0
    direction: in
    to_ip: "{{ wg_ip }}"
    port: "{{ redis_exporter_port }}"
    proto: tcp
    insert: 1

- name: Firewall — redis-queue exporter open to the monitoring host(s)
  community.general.ufw:
    rule: allow
    interface: wg0
    direction: in
    from_ip: "{{ hostvars[item].wg_ip }}"
    to_ip: "{{ wg_ip }}"
    port: "{{ redis_exporter_port }}"
    proto: tcp
    insert: 1
  loop: "{{ groups['monitoring'] }}"
