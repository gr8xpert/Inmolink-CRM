# BullMQ's Redis on db-1 (PLAN §5.5 Stage A): AOF every second, never evicts. Same settings as the
# local `redis-queue` service. Reached by workers over WireGuard with a password.
- name: Data directory
  ansible.builtin.file:
    path: /srv/redis-queue
    state: directory
    owner: "999"
    group: "1000"
    mode: "0750"

# The passwords go raw into a config line and into REDIS_*_URL: URL-safe characters only.
- name: redis-queue passwords are set and URL-safe
  ansible.builtin.assert:
    that:
      - vault_redis_limits_password is defined
      - vault_redis_limits_password is match('^[A-Za-z0-9_-]{32,}$')
      - vault_redis_media_password is defined
      - vault_redis_media_password is match('^[A-Za-z0-9_-]{32,}$')
    fail_msg: vault_redis_limits_password and vault_redis_media_password must be 32+ URL-safe characters (openssl rand -hex 32)
  no_log: true

# Password in a 0600 file, not argv (visible in `ps` to every local user).
- name: redis-queue config
  ansible.builtin.copy:
    dest: /etc/inmolink/redis-queue.conf
    content: |
      bind 127.0.0.1 {{ wg_ip }}
      port {{ redis_queue_port }}
      protected-mode yes
      requirepass {{ vault_redis_queue_password }}
      # Request apps keep rate-limit counters here because it never evicts (S1-F6). Their user reaches
      # only `inl:rl:*` keys and the commands the limiter needs: no queue key, no admin command.
      user limits on >{{ vault_redis_limits_password }} {{ redis_limits_acl }}
      # The media container (S3-F7) decodes untrusted uploads: its own queue keys only, never another pool's.
      user media on >{{ vault_redis_media_password }} {{ redis_media_acl }}
      appendonly yes
      appendfsync everysec
      maxmemory-policy noeviction
      dir /data
    owner: "999"
    group: "1000"
    mode: "0600"
  register: redis_queue_config
  no_log: true

- name: redis-queue
  community.docker.docker_container:
    name: redis-queue
    image: "{{ redis_image }}"
    network_mode: host
    restart_policy: unless-stopped
    volumes:
      - /srv/redis-queue:/data
      - /etc/inmolink/redis-queue.conf:/usr/local/etc/redis/redis.conf:ro
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: "{{ redis_queue_config.changed }}"
