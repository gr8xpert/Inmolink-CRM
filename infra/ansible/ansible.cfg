# Host baseline for Inmolink servers (S0-15, PLAN §3 #40 "Ansible for host config"). Runbook: docs/runbooks/deploy.md.
#   cd infra/ansible && ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventories/staging site.yml --ask-vault-pass
[defaults]
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
forks = 10
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
