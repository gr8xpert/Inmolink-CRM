# Production, PLAN §5.5 Stage A. PLACEHOLDER addresses (RFC 5737) until H4 delivers the servers:
# app-1 + db-1 in one datacenter, db-2 in another. wg_ip = address on the private WireGuard network.
all:
  children:
    app:
      hosts:
        app-1: { ansible_host: 203.0.113.10, wg_ip: 10.10.0.11 }
    db_primary:
      hosts:
        db-1: { ansible_host: 203.0.113.20, wg_ip: 10.10.0.21 }
    db_replica:
      hosts:
        db-2: { ansible_host: 198.51.100.30, wg_ip: 10.10.0.31, replication_slot: db_2 }
    db:
      children:
        db_primary:
        db_replica:
    # Weekly restore drill target (.github/workflows/restore-drill.yml): an otherwise empty server with
    # disk for a full restore, so the drill never competes with the standby. Holds no secrets at rest.
    drill:
      hosts:
        drill-1: { ansible_host: 198.51.100.40, wg_ip: 10.10.0.41 }
    # Outside the primary's datacenter, so it still alerts when app-1/db-1's datacenter is down.
    monitoring:
      hosts:
        db-2:
