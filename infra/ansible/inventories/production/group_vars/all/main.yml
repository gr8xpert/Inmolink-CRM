inmolink_env: production
wg_network: 10.10.0.0/24
# Secrets (vault_*) live in vault.yml next to this file (git-ignored; template: vault.example.yml).

postgres_shared_buffers: 16GB
postgres_effective_cache_size: 48GB
postgres_work_mem: 32MB
postgres_maintenance_work_mem: 2GB
postgres_max_connections: 300
# R2 bucket per environment; WAL-G encrypts client-side (libsodium) before upload.
walg_s3_prefix: s3://inmolink-backups-production/pg/main
walg_retain_full: 14
alert_email_to: ops@inmolink.es
# redis-queue ceiling (db-1: 64–128 GB): BullMQ + the website rate-limit counters (S7-F7 memory math: STATUS › Decisions).
# The app host running the api's redis-cache accessory and its exporter (infra/kamal/api.production.yml), scraped by
# Prometheus job `redis` (S7-F7).
redis_cache_host: app-1
redis_queue_maxmemory: 8gb
