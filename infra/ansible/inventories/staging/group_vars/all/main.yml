inmolink_env: staging
wg_network: 10.20.0.0/24

postgres_shared_buffers: 2GB
postgres_effective_cache_size: 6GB
postgres_work_mem: 16MB
postgres_maintenance_work_mem: 512MB
postgres_max_connections: 200
walg_s3_prefix: s3://inmolink-backups-staging/pg/main
walg_retain_full: 7
alert_email_to: ops@inmolink.es
# redis-queue ceiling (one shared box): BullMQ + the website rate-limit counters (S7-F7 memory math: STATUS › Decisions).
# The app host running the api's redis-cache accessory and its exporter (infra/kamal/api.staging.yml), scraped by
# Prometheus job `redis` (S7-F7).
redis_cache_host: staging-1
redis_queue_maxmemory: 1gb
# Public health probes (S16-05, blackbox_exporter on the monitoring host — infra/monitoring/rules/endpoints.yml). One per
# Kamal app with a proxy host: its `proxy.host` (infra/kamal/<app>.staging.yml) + healthcheck path. The public status page
# (infra/monitoring/status-page.yml) monitors the same production URLs from outside. `host`: the app host serving it
# (inventory group `app`; NodeDown of that host inhibits EndpointDown).
endpoint_probes:
  - { service: api, url: "https://api.staging.inmolink.es/readyz", host: staging-1 }
  - { service: feed-api, url: "https://feed.staging.inmolink.es/readyz", host: staging-1 }
  - { service: realtime, url: "https://realtime.staging.inmolink.es/readyz", host: staging-1 }
  - { service: web, url: "https://app.staging.inmolink.es/healthz", host: staging-1 }
  - { service: public, url: "https://sites.staging.inmolink.es/healthz", host: staging-1 }
