# Website search fallback alerts (S5-04, PLAN §5.4, ADR 0005 #5). Loaded by Prometheus on the monitoring host
# (Ansible role `monitoring`). Unit tests: search.test.yml (`promtool test rules`, tests/ops/alerts.int.test.ts).
# Metrics: feed-api / api processes (OpenTelemetry → Prometheus exporter), from packages/core/src/modules/search/website.ts:
#   inmolink_search_breaker_open   1 while a process skips the search engine (breaker open or probing), else 0
#   inmolink_search_queries_total  website search queries by `backend` (engine | fallback) and `reason`
#   inmolink_website_changes_held_seconds  how long the oldest committed `/v2/changes` row has waited behind an open
#                                  transaction (S7-03: feeds page below the cluster's oldest running transaction)
groups:
  - name: search
    rules:
      # The breaker opened (the engine failed or answered slower than SEARCH_SLOW_MS — 80 ms — five times in a row, or
      # for half of the calls in a 10 s window; S6-F3) and has not closed since: websites are served by the Postgres
      # fallback (no facets, references-only text search).
      - alert: SearchFallbackActive
        expr: max by (instance) (inmolink_search_breaker_open) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Website search on {{ $labels.instance }} has used the Postgres fallback for over 2 minutes"
          runbook: docs/runbooks/search.md#fallback-active
      # The engine keeps failing single queries without staying down (flapping, slow spikes): a share of website
      # searches is answered by the fallback even while the breaker closes again.
      - alert: SearchFallbackShareHigh
        expr: >
          sum(rate(inmolink_search_queries_total{backend="fallback"}[5m]))
            / sum(rate(inmolink_search_queries_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of website searches answered by the Postgres fallback"
          runbook: docs/runbooks/search.md#fallback-active
      # Website delta feeds (S7-03) hand out only changes below the oldest running transaction, so one transaction open
      # for minutes (a stuck job, an open psql session) holds every site's `/v2/changes` back. Nothing is lost; sites
      # see edits late. Last value of any feed-api process over 5 minutes.
      - alert: WebsiteChangesHeld
        expr: max(max_over_time(inmolink_website_changes_held_seconds[5m])) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Website change feeds are held back {{ $value | humanizeDuration }} by a long-running transaction"
          runbook: docs/runbooks/search.md#website-changes-held
