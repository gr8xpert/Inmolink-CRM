# Host alerts (S16-05, PLAN §17: disk > 70 %). Loaded by Prometheus on the monitoring host (Ansible role `monitoring`).
# Unit tests: node.test.yml (`promtool test rules`, tests/ops/alerts.int.test.ts).
# Metrics: node_exporter on every host (Ansible role node_exporter), Prometheus job `node`, `instance` = inventory name.
#   node_filesystem_avail_bytes / node_filesystem_size_bytes   per `mountpoint` (real disks: tmpfs, overlay and the
#                                                               container/boot mounts are left out)
groups:
  - name: node
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} does not answer node_exporter: down, or unreachable over WireGuard"
          runbook: docs/runbooks/observability.md#node-down
          runbook_url: "{{ $externalLabels.runbook_base }}/docs/runbooks/observability.md#node-down"
      # PLAN §17: disk over 70 % pages. Postgres (WAL, a slot retaining WAL), Docker images and logs are the usual causes.
      - alert: DiskUsageHigh
        expr: >-
          1 - max by (instance, mountpoint) (
            node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs", mountpoint!~"/boot.*|/run.*|/var/lib/docker/.+"}
              / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs", mountpoint!~"/boot.*|/run.*|/var/lib/docker/.+"}
          ) > 0.70
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
          runbook: docs/runbooks/observability.md#disk-usage
          runbook_url: "{{ $externalLabels.runbook_base }}/docs/runbooks/observability.md#disk-usage"
