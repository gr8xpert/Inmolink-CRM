# Dashboard API (Fastify): Kamal 2 config (S0-15, PLAN §3 #40). Destinations: api.staging.yml, api.production.yml.
# Deploy with scripts/ops/deploy.sh <staging|production> (migrations first, then every app). By hand:
#   RELEASE=<git sha> kamal deploy -c infra/kamal/api.yml -d staging --skip-push --version <git sha>
# Image built and pushed by CI (.github/workflows/ci.yml): ghcr.io/gr8xpert/inmolink-api:<git sha>.
# Accessories (redis-cache, meilisearch) live here: kamal accessory boot all -c infra/kamal/api.yml -d <dest>.
service: inmolink-api
image: gr8xpert/inmolink-api
require_destination: true
secrets_path: .kamal/secrets
registry:
  server: ghcr.io
  username: gr8xpert
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: deploy
servers:
  web:
    hosts: [] # per destination
proxy:
  app_port: 4000
  # Cloudflare (Full strict) in front: kamal-proxy serves the Cloudflare origin certificate.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT_PEM
    private_key_pem: CLOUDFLARE_ORIGIN_KEY_PEM
  forward_headers: true
  # One kamal-proxy per host, shared by every app: the same `run` in every config (S8-F1). Its access log cannot leave
  # out a path, and the per-site XML feed token sits in the URL path (`/v2/feeds/<token>/…`): the proxy's container
  # log is off. Requests are logged by the apps (pino, credential path segments redacted: platform/logger
  # `redactPath`). `log_max_size: ""` stops Kamal 2.12 adding `--log-opt max-size=10m` (it skips a blank value), which
  # the `none` driver would not take. Applied with `kamal proxy reboot` (runbook docs/runbooks/cdn.md, "Feed token
  # URLs and logs", with the staging check).
  run:
    log_max_size: ""
    options:
      log-driver: none
  # Zero downtime: traffic moves to the new container only once this passes; the old one then drains.
  healthcheck:
    path: /readyz
    interval: 2
    timeout: 3
  response_timeout: 30
deploy_timeout: 90
drain_timeout: 30
retain_containers: 5
env:
  clear:
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    # Client → Cloudflare → kamal-proxy (`kamal` network, kamal_network_subnet) → app. Trusting exactly these makes request.ip the
    # client's address. Cloudflare's published ranges (cloudflare.com/ips); keep in sync with
    # cloudflare_ips in infra/ansible/group_vars/all.yml (tests/workspace/deploy-config.test.ts checks).
    TRUST_PROXY: "10.200.0.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2c0f:f248::/32"
    SHUTDOWN_DRAIN_DELAY_MS: "2000"
    EDGE_REQUEST_ID_HEADER: "cf-ray"
    APP_ROLE: "http"
    API_PORT: "4000"
    API_METRICS_PORT: "0"
    # Accessories of infra/kamal/api.yml, reached over the `kamal` Docker network.
    MEILI_URL: "http://inmolink-api-meilisearch:7700"
    # Cloudflare R2 (S1-03): the endpoint names the account, so it is a secret like the keys.
    S3_REGION: "auto"
    S3_BUCKET_MEDIA: "inmolink-media"
    S3_BUCKET_EXPORTS: "inmolink-exports"
    # Media originals (S3-F9): the api signs upload PUTs into it.
    S3_BUCKET_MEDIA_WORK: "inmolink-media-work"
  secret:
    - RELEASE
    - SENTRY_DSN
    # redis://:<REDIS_CACHE_PASSWORD>@inmolink-api-redis-cache:6379 — the api accessory, password-protected (S1-F5).
    - REDIS_CACHE_URL
    # redis-queue as the `limits` ACL user: rate-limit counters only, never evicted (S1-F6).
    - REDIS_LIMITS_URL
    - DATABASE_URL_APP_USER
    - DATABASE_URL_APP_STAFF
    # app_auth: the per-request staff login checks (S1-F7 account status, S1-F9 session version).
    - DATABASE_URL_APP_AUTH
    - S3_ENDPOINT
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    # Not a secret, but named like one (the deploy-config check keeps *PRIVATE* names out of clear env).
    - S3_BUCKET_PRIVATE
    - REDIS_QUEUE_URL
    # Search-only key; the master key stays with the meilisearch accessory and the worker (S1-F5).
    - MEILI_SEARCH_KEY
    - AUTH_JWT_PUBLIC_KEYS
    - ENCRYPTION_KEYS
    - ENCRYPTION_ACTIVE_KEY_ID
    - HMAC_KEY
    # Signed media preview URLs (S3-06) name variants by their public id (S3-04).
    - MEDIA_URL_KEY
accessories:
  # Cache: bounded, LRU, no persistence (same flags as the local redis-cache service).
  # AUTH (S1-F5): the password goes into a 0600 config file, not the command line (visible in `ps`); the
  # single quotes keep the Docker host's shell (Kamal runs `docker run` over SSH) from expanding it; the
  # container's sh does. Hex only (`openssl rand -hex 32`): safe in the config line and in REDIS_CACHE_URL.
  # The image's entrypoint then drops to the redis user as usual.
  # S7-F7: a keyless `exporter` ACL user for redis_exporter (the same ACL as redis-queue's, infra/ansible group_vars
  # `redis_exporter_acl` — keep both in sync): server state only, no key, no CONFIG, never the cache password.
  redis-cache:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    cmd: >-
      sh -c 'case "$REDIS_CACHE_PASSWORD" in ""|*[!0-9a-f]*) echo "REDIS_CACHE_PASSWORD must be hex" >&2; exit 1;; esac
      && case "$REDIS_CACHE_EXPORTER_PASSWORD" in ""|*[!0-9a-f]*) echo "REDIS_CACHE_EXPORTER_PASSWORD must be hex" >&2; exit 1;; esac
      && umask 077
      && printf "requirepass %s\nuser exporter on >%s %s\n" "$REDIS_CACHE_PASSWORD" "$REDIS_CACHE_EXPORTER_PASSWORD"
      "resetkeys resetchannels -@all +ping +auth +hello +select +client|setname +client|getname +client|info +info +slowlog|get +slowlog|len +latency|latest +latency|histogram +command|info +cluster|info"
      > /tmp/redis.conf && chown redis:redis /tmp/redis.conf
      && exec docker-entrypoint.sh redis-server /tmp/redis.conf
      --maxmemory 4gb --maxmemory-policy allkeys-lru --save "" --appendonly no'
    host: "" # per destination
    env:
      secret:
        - REDIS_CACHE_PASSWORD
        - REDIS_CACHE_EXPORTER_PASSWORD
  # Memory metrics of redis-cache for Prometheus (S7-F7, RedisMemoryHigh / RedisMemoryCritical): reaches the cache over
  # the kamal network as the keyless `exporter` user, published on the host's WireGuard address only (`port` per
  # destination: "<wg_ip>:<redis_cache_exporter_port>:9121", infra/ansible group_vars) and reachable there from the
  # monitoring host only (roles/docker origin lock, INMOLINK-METRICS). CONFIG skipped: `maxmemory` comes from INFO.
  # `/scrape?target=` disabled: it would log in to any target with this exporter's password.
  # Image pinned like infra/ansible group_vars `redis_exporter_image` (keep both in sync).
  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    host: "" # per destination
    port: "" # per destination
    env:
      clear:
        REDIS_ADDR: redis://inmolink-api-redis-cache:6379
        REDIS_USER: exporter
        REDIS_EXPORTER_CONFIG_COMMAND: "-"
        REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT: "true"
      secret:
        - REDIS_PASSWORD:REDIS_CACHE_EXPORTER_PASSWORD
  # Rebuildable from Postgres (search reindex); the volume only saves reindex time.
  meilisearch:
    image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
    host: "" # per destination
    env:
      clear:
        MEILI_ENV: production
        MEILI_NO_ANALYTICS: "true"
      secret:
        - MEILI_MASTER_KEY
    volumes:
      - /srv/meilisearch:/meili_data
