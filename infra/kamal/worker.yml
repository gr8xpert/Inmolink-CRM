# BullMQ workers + outbox dispatcher: Kamal 2 config (S0-15, PLAN §3 #40). Destinations: worker.staging.yml, worker.production.yml.
# Deploy with scripts/ops/deploy.sh <staging|production> (migrations first, then every app). By hand:
#   RELEASE=<git sha> kamal deploy -c infra/kamal/worker.yml -d staging --skip-push --version <git sha>
# Image built and pushed by CI (.github/workflows/ci.yml): ghcr.io/gr8xpert/inmolink-worker:<git sha>.
service: inmolink-worker
image: gr8xpert/inmolink-worker
require_destination: true
secrets_path: .kamal/secrets
registry:
  server: ghcr.io
  username: gr8xpert
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: deploy
primary_role: workers
servers:
  workers:
    hosts: [] # per destination
    proxy: false
    # Workers finish or release in-flight jobs on SIGTERM (S0-06); long jobs get time.
    stop_timeout: 90
    # Container cap like the media role's (S6 review sizing, approved 2026-10-25): V8 below is sized for it.
    options:
      memory: 768m
      # S16-F6: found by the host's app-metrics scraper on the `kamal` network (job `worker`, kamal_role `workers`).
      network-alias: inmolink-worker-metrics
    env:
      clear:
        # Every pool but `media` and `pdf` (their own roles below). S11 review: `realtime` (live socket pushes) and `digest`
        # (notification e-mail digests) are pools of their own, so a digest burst never takes a live push's slot.
        # S12-01 (ADR 0018): `ai-usage` holds the request path's AI usage records, apart from the `ai` pool.
        WORKER_POOLS: "outbox,imports,indexing,matching,exports,email,realtime,digest,ai,ai-usage,social,maintenance"
        # S12-F4 rollout: prefix per-user realtime events (`agencyId:userId|`, so realtime nodes skip other members'
        # events unparsed). Realtime of the previous release cannot read the prefix: deploy realtime first, and set
        # "true" here in the next release, once every realtime node reads both forms.
        REALTIME_PREFIX_EVENTS: "false"
        # V8 sized like the media role's (S6-F5; the feed-import perf test runs with these): unsized on a large host
        # it idles at ~300 MB instead of ~150 MB (young generation grown at load), most of the 512 MB RSS budget.
        # A fixed glibc mmap threshold returns freed feed batches to the OS. Container cap: `options` above.
        NODE_OPTIONS: "--max-old-space-size=384 --max-semi-space-size=16"
        MALLOC_MMAP_THRESHOLD_: "131072"
        EMAIL_DRIVER: "smtp"
        # The api host's Meilisearch accessory (S5-02): the indexing pool applies settings and writes documents.
        MEILI_URL: "http://inmolink-api-meilisearch:7700"
        # Website lead acknowledgements (S7-05): similar listings' image URLs, like the website API's.
        MEDIA_CDN_URL: "https://media.inmolink.es"
      # Only these pools: the outbox and cross-tenant jobs (app_system), email, stored credentials, tokens.
      secret:
        - DATABASE_URL_APP_USER
        - DATABASE_URL_APP_SYSTEM
        # The email pool's lead acknowledgements read the site's inventory as the website API does (S7-05).
        - DATABASE_URL_APP_PUBLIC
        # redis://:<REDIS_CACHE_PASSWORD>@inmolink-api-redis-cache:6379 — the api accessory, password-protected (S1-F5).
        - REDIS_CACHE_URL
        - REDIS_QUEUE_URL
        # R2 token for exports, the orphan sweeps (S1-F7) and private documents.
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
        - SMTP_URL
        - EMAIL_FROM
        - ENCRYPTION_KEYS
        - ENCRYPTION_ACTIVE_KEY_ID
        - HMAC_KEY
        # Not the master key (it can mint keys): a key scoped to the listings indexes (docs/runbooks/deploy.md step 6).
        - MEILI_MASTER_KEY:MEILI_INDEXING_KEY
        # Edge cache purge (S7-06, indexing pool): the zone id and an API token with "Cache Purge" on that zone only.
        - CLOUDFLARE_ZONE_ID
        - CLOUDFLARE_PURGE_TOKEN
  # Image decoding of untrusted uploads (S3-04) in its own container: a decoder crash or memory blow-up stays
  # here, away from the outbox, email and the other pools. Budget 512 MB RSS; the hard cap leaves headroom above it.
  # Least privilege (S3-F4): only the shared variables below plus the narrow `app_media` role — no app_system, SMTP,
  # encryption or HMAC keys (tests/workspace/deploy-config.test.ts fails otherwise); read-only root filesystem.
  # S3-F7: no cache at all; redis-queue as the `media` ACL user (its own BullMQ keys only); its own R2 token
  # (docs/runbooks/deploy.md: the media and work buckets only, never the private one — S3-F9).
  media:
    hosts: [] # per destination
    proxy: false
    stop_timeout: 90
    options:
      memory: 768m
      read-only: true
      tmpfs: /tmp
      # S16-F6: job `worker`, kamal_role `media` (infra/ansible/roles/app_metrics).
      network-alias: inmolink-worker-media-metrics
    env:
      clear:
        WORKER_POOLS: "media"
        # The RSS budget holds only with memory sized here, not by the host (S5-CI; the burst test runs with these):
        # V8 as the 768m cgroup sizes it (unconstrained on a large host it grew 128 MB of young generation at load,
        # idle 293 MB instead of 146 MB), and a fixed glibc mmap threshold so freed pixel buffers go back to the OS
        # (the dynamic one rises after the first large free and keeps later buffers on the heap: ~140 MB held).
        NODE_OPTIONS: "--max-old-space-size=384 --max-semi-space-size=16"
        MALLOC_MMAP_THRESHOLD_: "131072"
      secret:
        - DATABASE_URL_APP_MEDIA
        # ENV:SECRET aliases: the same variable names, the media container's own credentials.
        - REDIS_QUEUE_URL:REDIS_QUEUE_URL_MEDIA
        - S3_ACCESS_KEY_ID:S3_MEDIA_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY:S3_MEDIA_SECRET_ACCESS_KEY
  # PDF rendering in Chrome (S12-05) in its own container (S17-F53). Measured with real photos: one 20-page portfolio peaks
  # at 740 MB and is OOM-killed under 768m with nothing else running, so the `workers` role cannot hold it beside the
  # outbox. Chrome parses untrusted text, and its sandbox needs the seccomp additions below: they stay away from every
  # other container, and this one holds only what a render needs (apps/worker/src/config.ts `pdfPoolEnv`).
  # PDF_CHROME_NO_SANDBOX must stay unset: this container is not a sandbox for Chrome.
  # /etc/docker/seccomp-chrome.json comes from Ansible (role `docker`): run it before the first deploy of this role.
  pdf:
    hosts: [] # per destination
    proxy: false
    stop_timeout: 90
    options:
      # Two 50-listing portfolios at once peak at 1.67 GB, 24 20-page ones two at a time at 1.78 GB, no OOM (concurrency 2).
      memory: 2g
      read-only: true
      tmpfs: /tmp
      cap-drop: ALL
      security-opt:
        - no-new-privileges
        - seccomp=/etc/docker/seccomp-chrome.json
      # Reaps Chrome's helpers when a browser exits: node as PID 1 leaves 4 or 5 zombies per browser, this leaves none.
      init: true
      # S17-F53: job `worker`, kamal_role `pdf` (infra/ansible/roles/app_metrics).
      network-alias: inmolink-worker-pdf-metrics
    env:
      clear:
        WORKER_POOLS: "pdf"
        PDF_CHROME_EXECUTABLE: "/usr/bin/chromium"
        PDF_RENDER_CONCURRENCY: "2"
        # Chrome will not start without a writable config directory (crash database); the root filesystem is read-only.
        XDG_CONFIG_HOME: "/tmp/.config"
        XDG_CACHE_HOME: "/tmp/.cache"
        NODE_OPTIONS: "--max-old-space-size=384 --max-semi-space-size=16"
        MALLOC_MMAP_THRESHOLD_: "131072"
        MEDIA_CDN_URL: "https://media.inmolink.es"
      secret:
        - DATABASE_URL_APP_PUBLIC
        - REDIS_QUEUE_URL
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
        - HMAC_KEY
retain_containers: 5
# Shared by every role: only what the media container may see too.
env:
  clear:
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    APP_ROLE: "worker"
    WORKER_HEALTH_PORT: "4003"
    # S16-F6: /metrics inside the container only, never published (two containers of a role run during a deploy):
    # reached over the `kamal` network by the app-metrics scraper, not from outside the host.
    WORKER_METRICS_PORT: "9467"
    METRICS_HOST: "0.0.0.0"
    METRICS_ALLOW_WILDCARD: "true"
    # Cloudflare R2 (S1-03): media processing and the orphan sweeps (S3-04, S1-F7).
    S3_REGION: "auto"
    S3_BUCKET_MEDIA: "inmolink-media"
    S3_BUCKET_EXPORTS: "inmolink-exports"
    # Media originals and masters (S3-F9).
    S3_BUCKET_MEDIA_WORK: "inmolink-media-work"
    # Per-site XML feeds (S7-07): their own bucket (H3), written by the exports pool, read by feed-api.
    S3_BUCKET_FEEDS: "inmolink-feeds"
  secret:
    - RELEASE
    - SENTRY_DSN
    # Credentials (Redis, R2) are per role above (S3-F7); the endpoint is shared.
    - S3_ENDPOINT
    # Not a secret, but named like one (the deploy-config check keeps *PRIVATE* names out of clear env).
    - S3_BUCKET_PRIVATE
    # Media variant URLs (S3-04): its own key, never rotated with HMAC_KEY (a rotation would move every URL).
    - MEDIA_URL_KEY
