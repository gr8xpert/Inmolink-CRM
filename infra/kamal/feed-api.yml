# Website feed API (public read path): Kamal 2 config (S0-15, PLAN §3 #40). Destinations: feed-api.staging.yml, feed-api.production.yml.
# Deploy with scripts/ops/deploy.sh <staging|production> (migrations first, then every app). By hand:
#   RELEASE=<git sha> kamal deploy -c infra/kamal/feed-api.yml -d staging --skip-push --version <git sha>
# Image built and pushed by CI (.github/workflows/ci.yml): ghcr.io/gr8xpert/inmolink-feed-api:<git sha>.
service: inmolink-feed-api
image: gr8xpert/inmolink-feed-api
require_destination: true
secrets_path: .kamal/secrets
registry:
  server: ghcr.io
  username: gr8xpert
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: deploy
servers:
  web:
    hosts: [] # per destination
proxy:
  app_port: 4001
  # Cloudflare (Full strict) in front: kamal-proxy serves the Cloudflare origin certificate.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT_PEM
    private_key_pem: CLOUDFLARE_ORIGIN_KEY_PEM
  forward_headers: true
  # One kamal-proxy per host, shared by every app: the same `run` in every config (S8-F1). Its access log cannot leave
  # out a path, and the per-site XML feed token sits in the URL path (`/v2/feeds/<token>/…`): the proxy's container
  # log is off. Requests are logged by the apps (pino, credential path segments redacted: platform/logger
  # `redactPath`). `log_max_size: ""` stops Kamal 2.12 adding `--log-opt max-size=10m` (it skips a blank value), which
  # the `none` driver would not take. Applied with `kamal proxy reboot` (runbook docs/runbooks/cdn.md, "Feed token
  # URLs and logs", with the staging check).
  run:
    log_max_size: ""
    options:
      log-driver: none
  # Zero downtime: traffic moves to the new container only once this passes; the old one then drains.
  healthcheck:
    path: /readyz
    interval: 2
    timeout: 3
  response_timeout: 30
deploy_timeout: 90
drain_timeout: 30
retain_containers: 5
env:
  clear:
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    # Client → Cloudflare → kamal-proxy (`kamal` network, kamal_network_subnet) → app. Trusting exactly these makes request.ip the
    # client's address. Cloudflare's published ranges (cloudflare.com/ips); keep in sync with
    # cloudflare_ips in infra/ansible/group_vars/all.yml (tests/workspace/deploy-config.test.ts checks).
    TRUST_PROXY: "10.200.0.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2c0f:f248::/32"
    SHUTDOWN_DRAIN_DELAY_MS: "2000"
    EDGE_REQUEST_ID_HEADER: "cf-ray"
    APP_ROLE: "http"
    FEED_API_PORT: "4001"
    FEED_API_METRICS_PORT: "0"
    # Accessories of infra/kamal/api.yml, reached over the `kamal` Docker network.
    MEILI_URL: "http://inmolink-api-meilisearch:7700"
    # Public media host (R2 custom domain, docs/runbooks/media-public-host.md): image URLs in website documents (S7-03).
    MEDIA_CDN_URL: "https://media.inmolink.es"
    # Edge caching of website API first pages and details (S7-06). Turn on per destination only after
    # `pnpm ops:cdn-rules --env <env> --apply` and `--verify` passed for that zone (runbook docs/runbooks/cdn.md):
    # without those rules Cloudflare ignores Vary and would share one site's answers with another.
    WEBSITE_EDGE_CACHE: "false"
    # Per-site XML feeds (S7-07): read from their own bucket (`site-feeds/…`) only; S3_BUCKET_EXPORTS is the fallback
    # name when S3_BUCKET_FEEDS is unset (local stacks) and is never read here otherwise.
    S3_REGION: "auto"
    S3_BUCKET_FEEDS: "inmolink-feeds"
    S3_BUCKET_EXPORTS: "inmolink-exports"
    # S12-08 AI search (ADR 0018, Proposed): off until the ADR is accepted and the `feed_ai` ACL user exists. Model IDs
    # and prices are configuration, never code; without AI_PROVIDER, /v2/search/ai answers with keyword search.
    # AI_PROVIDER: "anthropic"
    # AI_MODEL_FAST: "<FAST tier model id>"
    # AI_MODEL_SMART: "<SMART tier model id>"
    # AI_PRICING: '{"<model id>": {"input": 0, "output": 0}}'
    # SEARCH_AI_TIMEOUT_MS: "500"
  secret:
    - RELEASE
    - SENTRY_DSN
    # redis://:<REDIS_CACHE_PASSWORD>@inmolink-api-redis-cache:6379 — the api accessory, password-protected (S1-F5).
    - REDIS_CACHE_URL
    # redis-queue as the `limits` ACL user: rate-limit counters only, never evicted (S1-F6).
    - REDIS_LIMITS_URL
    - DATABASE_URL_APP_PUBLIC
    # Website form intake (S7-05): leads and viewing requests only (website_leads + their outbox events).
    - DATABASE_URL_APP_INTAKE
    # Per-site XML feeds (S7-07): an R2 token with Object Read only on inmolink-feeds (runbook deploy.md).
    - S3_ENDPOINT
    - S3_ACCESS_KEY_ID:S3_FEEDS_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY:S3_FEEDS_SECRET_ACCESS_KEY
    # Cloudflare Turnstile (H3): website lead forms through publishable keys need it.
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET_KEY
    # Search-only key; the master key stays with the meilisearch accessory and the worker (S1-F5).
    - MEILI_SEARCH_KEY
    - ENCRYPTION_KEYS
    - ENCRYPTION_ACTIVE_KEY_ID
    - HMAC_KEY
    # S12-08 AI search (ADR 0018, Proposed) — uncomment with the clear entries above:
    # redis-queue as the `feed_ai` ACL user: produces `ai` pool jobs only (ai.recordUsage, ai.refreshSpend).
    # - REDIS_QUEUE_URL:REDIS_QUEUE_URL_FEED_AI
    # - ANTHROPIC_API_KEY
