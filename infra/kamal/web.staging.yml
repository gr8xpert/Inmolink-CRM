# staging overrides for web.yml, merged over the base by `-d staging`.
servers:
  web:
    hosts: [79.99.44.167]
proxy:
  host: staging-app.inmolink.es
env:
  clear:
    DEPLOY_ENV: "staging"
    OTEL_TRACES_SAMPLE_RATIO: "1"
    WEB_URL: "https://staging-app.inmolink.es"
    API_URL: "https://staging-api.inmolink.es"
    # S16-03: chat / notification sockets; the dashboard CSP allows exactly this origin (wss).
    REALTIME_PUBLIC_URL: "https://staging-realtime.inmolink.es"
    FEED_API_PUBLIC_URL: "https://staging-feed.inmolink.es"
    PUBLIC_PAGES_URL: "https://staging-sites.inmolink.es"
