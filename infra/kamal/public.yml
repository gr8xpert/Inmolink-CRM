# Agency public websites (Next.js): Kamal 2 config (S0-15, PLAN §3 #40). Destinations: public.staging.yml, public.production.yml.
# Deploy with scripts/ops/deploy.sh <staging|production> (migrations first, then every app). By hand:
#   RELEASE=<git sha> kamal deploy -c infra/kamal/public.yml -d staging --skip-push --version <git sha>
# Image built and pushed by CI (.github/workflows/ci.yml): ghcr.io/gr8xpert/inmolink-public:<git sha>.
service: inmolink-public
image: gr8xpert/inmolink-public
require_destination: true
secrets_path: .kamal/secrets
registry:
  server: ghcr.io
  username: gr8xpert
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: deploy
servers:
  web:
    hosts: [] # per destination
proxy:
  app_port: 3000
  # Cloudflare (Full strict) in front: kamal-proxy serves the Cloudflare origin certificate.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT_PEM
    private_key_pem: CLOUDFLARE_ORIGIN_KEY_PEM
  forward_headers: true
  # One kamal-proxy per host, shared by every app: the same `run` in every config (S8-F1). Its access log cannot leave
  # out a path, and the per-site XML feed token sits in the URL path (`/v2/feeds/<token>/…`): the proxy's container
  # log is off. Requests are logged by the apps (pino, credential path segments redacted: platform/logger
  # `redactPath`). `log_max_size: ""` stops Kamal 2.12 adding `--log-opt max-size=10m` (it skips a blank value), which
  # the `none` driver would not take. Applied with `kamal proxy reboot` (runbook docs/runbooks/cdn.md, "Feed token
  # URLs and logs", with the staging check).
  run:
    log_max_size: ""
    options:
      log-driver: none
  # Zero downtime: traffic moves to the new container only once this passes; the old one then drains.
  healthcheck:
    path: /healthz
    interval: 2
    timeout: 3
  response_timeout: 30
deploy_timeout: 90
drain_timeout: 30
retain_containers: 5
env:
  clear:
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    # Client → Cloudflare → kamal-proxy (`kamal` network, kamal_network_subnet) → app. Trusting exactly these makes request.ip the
    # client's address. Cloudflare's published ranges (cloudflare.com/ips); keep in sync with
    # cloudflare_ips in infra/ansible/group_vars/all.yml (tests/workspace/deploy-config.test.ts checks).
    TRUST_PROXY: "10.200.0.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2c0f:f248::/32"
    SHUTDOWN_DRAIN_DELAY_MS: "2000"
    EDGE_REQUEST_ID_HEADER: "cf-ray"
    APP_ROLE: "http"
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    # iFrame embeds (S7-F8) read like feed-api: the website API read path, the search accessory, media URLs.
    MEILI_URL: "http://inmolink-api-meilisearch:7700"
    MEDIA_CDN_URL: "https://media.inmolink.es"
  secret:
    - RELEASE
    - SENTRY_DSN
    # iFrame embeds (S7-F8): reads as app_public, the lead form through app_intake (S7-05), site scopes in redis-cache,
    # per-IP embed limits as the `limits` ACL user, the search-only key, Turnstile (H3), HMAC_KEY (cursors, lead hashes).
    - DATABASE_URL_APP_PUBLIC
    - DATABASE_URL_APP_INTAKE
    - REDIS_CACHE_URL
    - REDIS_LIMITS_URL
    - MEILI_SEARCH_KEY
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET_KEY
    - HMAC_KEY
