; Shared PgBouncer settings, included by dev.ini and test.ini (each sets its own [databases] host).
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
max_prepared_statements = 200

; Local only: the bootstrap superuser is in userlist.txt; every other role
; (app_user, app_system, app_public — S0-04) is looked up through auth_query.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
admin_users = postgres
stats_users = postgres

ignore_startup_parameters = extra_float_digits,options
server_reset_query =
