# CI (S0-14, PLAN §18). Every check `pnpm verify` runs locally, split into jobs that run in parallel
# on their own runners, plus i18n, build and the migration check. Branch protection on `main` requires
# the `required` job (docs/runbooks/ci.md), so a failing isolation or boundary check blocks merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # Pull requests run the Turbo tasks of affected packages only (diffed against the base commit);
  # main runs everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  static:
    name: Typecheck, lint, unit, i18n, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { cache-key: static }
      - name: Typecheck, lint, build
        run: pnpm turbo run typecheck typecheck:root lint lint:root build $AFFECTED
      # Own step: unit tests with timing assertions do not compete with tsc and next build for CPU.
      - name: Unit tests
        run: pnpm turbo run test test:root $AFFECTED
      - name: i18n catalogs
        if: success() || failure() # report catalog problems even when the step above failed
        run: pnpm i18n:check

  boundaries:
    name: Boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cache-key: boundaries }
      - name: Module boundaries (dependency-cruiser)
        run: pnpm check:boundaries
      - name: Boundary rule tests (planted violations, gen:module output)
        run: pnpm test:boundaries

  isolation:
    name: Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { cache-key: isolation }
      - name: Test stack (Postgres + PgBouncer)
        run: docker compose --profile test up -d --wait postgres-test pgbouncer-test
      - name: Tenant isolation suite + RLS guard
        run: pnpm test:isolation

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { cache-key: integration }
      - name: Test stack
        run: docker compose --profile test up -d --wait
      # One step at a time: the root suites share the stack with the package suites.
      - name: Package integration tests
        run: pnpm turbo run test:int $AFFECTED --concurrency=1
      - name: Workspace integration tests
        run: pnpm test:int:root
      - name: Throughput checks
        run: pnpm test:perf:root
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile test logs --tail=200

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 } # the previous release's migrations come from git history
      - uses: ./.github/actions/setup
        with: { cache-key: migrations }
      - name: Schema files match the generated migrations
        run: |
          timeout 120 pnpm db:generate < /dev/null # drizzle-kit prompts on ambiguous renames: fail, do not hang
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            git status --short -- packages/db/migrations
            echo "::error::schema changed without a migration: run pnpm db:generate and commit the result"
            exit 1
          fi
      - name: Test stack (Postgres)
        run: docker compose --profile test up -d --wait postgres-test
      - name: Apply to an empty database and over the previous release
        run: pnpm ci:migrations --test

  # Deploy configuration with the real tools, in the same containers as locally (S0-15): Ansible syntax +
  # every template rendered for every host, `kamal config` for every app × destination.
  deploy-config:
    name: Deploy config (Ansible, Kamal)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Ansible
        run: docker run --rm -v "$PWD:/repo" -w /repo python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f bash scripts/ci/deploy-config-check.sh ansible
      - name: Kamal
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo ruby:3.4-slim@sha256:c12225b6a73743f943530d9e610f4ae78e0dbcffdcf797b01522a55f7d25acb3 bash -c
          'apt-get update -qq && apt-get install -y -qq git build-essential >/dev/null &&
          git config --global --add safe.directory /repo && bash scripts/ci/deploy-config-check.sh kamal'

  # The single check branch protection requires: fails unless every job above succeeded.
  required:
    name: required
    if: always()
    needs: [static, boundaries, isolation, integration, migrations, deploy-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  images:
    name: Image (${{ matrix.app }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, feed-api, realtime, worker, web, public]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/inmolink-${{ matrix.app }}
          # `<sha>` is the tag Kamal deploys (its --version is the full git sha); `sha-<sha>` kept for humans.
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=long
            type=raw,value=main
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/app/Dockerfile
          build-args: APP=${{ matrix.app }}
          load: true
          tags: inmolink-${{ matrix.app }}:smoke
          cache-from: type=gha,scope=image-${{ matrix.app }}
      # Without env a Node app exits on config validation, but only after every import has resolved:
      # a dependency missing from the production install shows up here, before anything is pushed.
      - name: Smoke (production install resolves every import)
        if: matrix.app != 'web' && matrix.app != 'public'
        env:
          IMAGE: inmolink-${{ matrix.app }}:smoke
        run: |
          out=$(timeout 60 docker run --rm "$IMAGE" 2>&1 || true)
          echo "$out" | tail -20
          if echo "$out" | grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)'; then exit 1; fi
      # scripts/ops/deploy.sh runs migrations + RLS from the worker image (S0-15): the CLI must resolve too.
      - name: Smoke (database deploy CLI in the worker image)
        if: matrix.app == 'worker'
        env:
          IMAGE: inmolink-worker:smoke
        run: |
          out=$(timeout 60 docker run --rm -e NODE_ENV=production --workdir /repo "$IMAGE" node packages/db/dist/cli/deploy.js 2>&1 || true)
          echo "$out" | tail -20
          if echo "$out" | grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)'; then exit 1; fi
          echo "$out" | grep -q 'DATABASE_URL_APP_OWNER' # failed on config validation, i.e. after every import resolved
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/app/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

  # The Postgres image db-1/db-2 run (Ansible role `postgres`): the same Dockerfile as local dev and the
  # tests, so the drill and the replica tests exercise production's WAL-G and ops scripts (S0-15).
  image-postgres:
    name: Image (postgres)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from docker-compose.yml (single source of the version)
        id: tag
        run: |
          echo "tag=$(grep -oP 'image: inmolink/postgres:\K\S+' docker-compose.yml)" >> "$GITHUB_OUTPUT"
      # Immutable tag: db hosts pull it by name, so overwriting it would restart both db servers with a
      # different build on the next Ansible run. A changed Dockerfile needs a new tag in docker-compose.yml.
      - name: Already published?
        id: exists
        env:
          REF: ghcr.io/${{ github.repository_owner }}/inmolink-postgres:${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$REF exists: not rebuilding (bump the tag in docker-compose.yml to publish a new build)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.exists.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/docker/postgres
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inmolink-postgres:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/inmolink-postgres:${{ github.sha }}
          cache-from: type=gha,scope=image-postgres
          cache-to: type=gha,mode=max,scope=image-postgres
