name: Setup workspace
description: pnpm + Node from package.json, dependencies from the lockfile (pnpm store cached), Turbo local cache.
inputs:
  cache-key:
    description: Turbo cache scope (one per job, so jobs do not overwrite each other's entries)
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm version from package.json "packageManager"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.15.0
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Turbo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.cache-key }}-
